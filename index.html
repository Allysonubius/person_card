      .login-right {

      }
      .news-container {

}
      .news-card {

  border-radius:12px;
  margin-bottom:12px;
  cursor:pointer;

  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  border:1px solid rgba(255,255,255,0.05);
}

.news-card:hover {
  transform: scale(1.06) translateY(-5px);
  background: rgba(0,0,0,0.75);

  border:1px solid rgba(255,255,255,0.15);

      .news-title {

  font-size:1rem;

      .pagination {

      .desktop {

      .hidden {

      }
      .window {
        position: absolute;
        width: 500px;
        height: 350px;

        backdrop-filter: blur(20px);
        border-radius: 12px;

      .taskbar {

        background: #111;

        align-items: center;

        width: 200px;

        background: #000;
        border-radius: 8px;
        overflow: hidden;
        display: none;
      }
      .preview iframe {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .task-item:hover .preview {
        display: block;
      }

      </div>

      <div id="windows"></div>

      <div class="taskbar">
        <div class="left" onclick="toggleMenu()">🪟</div>
        <div class="center" id="tasks"></div>

        <div class="right">
          <div onclick="toggleVolume()" id="sound">🔊</div>

          <div id="volumePanel" class="volume-panel hidden">
            <input
              type="range"
              min="0"
              max="100"
              value="20"
              oninput="setVolume(this.value)"
            />
            <span id="volumeLabel">20%</span>
          </div>

          <span id="clock"></span>
        </div>

    <script>
      // LOGIN
      function loginSystem() {
        login.classList.add("hidden");
        desktop.classList.remove("hidden");
        openApp("music");

        setTimeout(() => {
          let iframe = document.querySelector("#ytPlayer");
          if (iframe) {
            iframe.src += "?autoplay=1";
          }
        }, 400);
      }

      // CLOCK
      setInterval(() => {
        loginClock.innerText = new Date().toLocaleTimeString();
        clock.innerText = new Date().toLocaleTimeString();
      }, 1000);

      // NEWS (igual)
      let newsData = [],
        page = 0;
      async function loadNews() {
        try {
          let res = await fetch(
            "https://hacker-news.firebaseio.com/v0/topstories.json",
          );
          let ids = await res.json();
          for (let i = 0; i < 30; i++) {
            let item = await fetch(
              `https://hacker-news.firebaseio.com/v0/item/${ids[i]}.json`,
            ).then((r) => r.json());
            newsData.push(item);
          }
          renderNews();
        } catch {
          newsData = [{ title: "Cloud cresce", url: "#" }];
          renderNews();
        }
      }
      function renderNews() {
        newsList.innerHTML = "";
        let start = page * 10;
        let end = start + 10;
        newsData.slice(start, end).forEach((n) => {
          let div = document.createElement("div");
          div.className = "news-card";
          let domain = n.url ? new URL(n.url).hostname : "tech";
          div.innerHTML = `<div class="news-title">${n.title}</div><div class="news-source">${domain}</div>`;
          div.onclick = () => window.open(n.url || "#");
          newsList.appendChild(div);
        });
      }
      function nextPage() {
        if ((page + 1) * 10 < newsData.length) {
          page++;
          renderNews();
        }
      }
      function prevPage() {
        if (page > 0) {
          page--;
          renderNews();
        }
      }
      loadNews();

      // VOLUME
      function toggleVolume() {
        volumePanel.classList.toggle("hidden");
      }
      function setVolume(val) {
        volumeLabel.innerText = val + "%";
        sound.innerText = val == 0 ? "🔇" : "🔊";
      }

      // WINDOWS
      let z = 1;

      function toggleMenu() {
        menu.classList.toggle("hidden");
      }

      function openApp(id) {
        let existing = [...windows.children].find((w) => w.dataset.app === id);

          existing.style.display = "block";
          existing.style.zIndex = ++z;
          return;
        }

}

        win.innerHTML = `
 <div class="title">

        windows.appendChild(win);

      // 🔥 TASK MELHORADO
      function task(id, win) {
        let t = document.createElement("div");
        t.className = "task-item";
        t.innerText = id;

        let preview = document.createElement("div");
        preview.className = "preview";

        let iframe = win.querySelector("iframe");
        if (iframe) {
          let clone = iframe.cloneNode();
          preview.appendChild(clone);
        }

        t.appendChild(preview);

        t.onclick = () => {
          if (win.style.display === "none") {
            win.style.display = "block";
            win.style.zIndex = ++z;
          } else {
            win.style.display = "none";
          }
        };

        tasks.appendChild(t);
      }

      function closeWin(btn, id) {
        btn.closest(".window").remove();
        [...tasks.children].forEach((t) => {
          if (t.innerText === id) t.remove();
        });
      }

      function min(btn) {
        btn.closest(".window").style.display = "none";
      }

      function max(btn) {
        let w = btn.closest(".window");
        w.style.width = "100%";
        w.style.height = "calc(100% - 45px)";
        w.style.top = 0;
        w.style.left = 0;
      }

      // 🔥 DRAG COM LIMITE
      function drag(el) {
        let is = false,
          ox = 0,
          oy = 0;

        el.querySelector(".title").onmousedown = (e) => {
          is = true;
          ox = e.clientX - el.offsetLeft;
          oy = e.clientY - el.offsetTop;
        };

        document.onmouseup = () => (is = false);

        document.onmousemove = (e) => {
          if (!is) return;

          let x = e.clientX - ox;
          let y = e.clientY - oy;

          let maxX = window.innerWidth - el.offsetWidth;
          let maxY = window.innerHeight - el.offsetHeight - 45;

          if (x < 0) x = 0;
          if (y < 0) y = 0;
          if (x > maxX) x = maxX;
          if (y > maxY) y = maxY;

          el.style.left = x + "px";
          el.style.top = y + "px";
        };
      }

      function logout(){
        desktop.classList.add('hidden');
        login.classList.remove('hidden');

        windows.innerHTML = '';
        tasks.innerHTML = '';
