<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Allyson OS — Allyson de Oliveira | Engenheiro de Software</title>
    <meta
      name="description"
      content="Cartão de apresentação de Allyson de Oliveira Brandão, Engenheiro de Software Sênior Full Stack. Arquitetura de microsserviços, modernização de legados, Java, Spring Boot, Angular, React e AWS."
    />
    <meta name="author" content="Allyson de Oliveira Brandão" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Allyson OS — Allyson de Oliveira | Engenheiro de Software"
    />
    <meta
      property="og:description"
      content="Engenheiro de Software Sênior Full Stack — microsserviços, modernização de legados, Java, Spring Boot, Angular e AWS."
    />
    <meta property="og:image" content="./img/62918698.jpg" />
    <meta
      property="og:url"
      content="https://allysonubius.github.io/person_card/"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allyson OS — Allyson de Oliveira" />
    <meta
      name="twitter:description"
      content="Engenheiro de Software Sênior · Full Stack. Portfólio interativo."
    />
    <meta name="twitter:image" content="./img/62918698.jpg" />

    <link rel="canonical" href="https://allysonubius.github.io/person_card/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./img/62918698.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>

  <body>
    <div class="wallpaper"></div>

    <!-- ======================= TELA DE BLOQUEIO ======================= -->
    <div id="lock" class="lock">
      <div class="lock-clock">
        <div class="lock-date" id="lockDate"></div>
        <div class="lock-time" id="lockTime">--:--</div>
      </div>

      <div class="lock-user">
        <img
          class="lock-avatar"
          src="./img/62918698.jpg"
          alt="Foto de perfil de Allyson de Oliveira"
        />
        <div class="lock-name">Allyson de Oliveira</div>
        <div class="lock-role">Engenheiro de Software Sênior</div>

        <form class="lock-field" id="lockForm">
          <label class="sr-only" for="lockPass">Senha</label>
          <input
            id="lockPass"
            type="password"
            placeholder="Digite a senha"
            autocomplete="off"
          />
          <button
            class="lock-go"
            id="lockGo"
            type="submit"
            aria-label="Desbloquear"
          >
            →
          </button>
        </form>

        <p class="lock-hint">Sem senha — pressione Enter para entrar</p>
      </div>
    </div>

    <!-- ======================== ÁREA DE TRABALHO ======================== -->
    <div id="desktop" class="desktop hidden">
      <!-- BARRA SUPERIOR -->
      <div class="menubar">
        <div class="menubar-left">
          <button
            id="systemBtn"
            class="menu-item strong"
            type="button"
            aria-label="Menu do sistema"
            aria-expanded="false"
          >
            ◆
          </button>
          <button id="activeApp" class="menu-item strong" type="button">
            Início
          </button>
          <span class="menu-item decor">Arquivo</span>
          <span class="menu-item decor">Editar</span>
          <span class="menu-item decor">Visualizar</span>
          <span class="menu-item decor">Janela</span>
          <span class="menu-item decor">Ajuda</span>
        </div>

        <div class="menubar-right">
          <button
            id="settingsBtn"
            class="menu-item"
            type="button"
            aria-label="Ajustes rápidos"
            aria-expanded="false"
          >
            <span id="soundIcon">🔊</span>
          </button>
          <span class="menu-item decor">📶</span>
          <span class="menu-item decor">🔋</span>
          <button
            id="clockBtn"
            class="menu-item menubar-clock"
            type="button"
            aria-label="Painel de notícias"
            aria-expanded="false"
          >
            <span id="menuDate"></span> <span id="menuTime">--:--</span>
          </button>
        </div>
      </div>

      <!-- MENU DO SISTEMA -->
      <div id="systemMenu" class="popover hidden">
        <button type="button" data-open="about">
          <span aria-hidden="true">💻</span> Sobre este sistema
        </button>
        <hr />
        <button type="button" data-open="portfolio">
          <span aria-hidden="true">💼</span> Portfólio
        </button>
        <button type="button" data-open="contact">
          <span aria-hidden="true">✉️</span> Contato
        </button>
        <button type="button" data-open="music">
          <span aria-hidden="true">🎵</span> Música
        </button>
        <hr />
        <button id="lockBtn" type="button">
          <span aria-hidden="true">🔒</span> Bloquear tela
        </button>
      </div>

      <!-- AJUSTES RÁPIDOS -->
      <div id="quickSettings" class="popover hidden">
        <div class="cc-tile">
          <div class="cc-label">Som</div>
          <div class="cc-row">
            <span aria-hidden="true">🔈</span>
            <label class="sr-only" for="volumeRange">Volume</label>
            <input id="volumeRange" type="range" min="0" max="100" value="35" />
            <span id="volumeLabel">35%</span>
          </div>
        </div>

        <div class="cc-grid">
          <div class="cc-tile"><span aria-hidden="true">📶</span> Wi-Fi</div>
          <div class="cc-tile"><span aria-hidden="true">🔵</span> Bluetooth</div>
          <div class="cc-tile"><span aria-hidden="true">🌙</span> Foco</div>
        </div>
      </div>

      <!-- PAINEL DE NOTÍCIAS -->
      <aside id="newsPanel" class="news-panel hidden">
        <div class="nc-header">
          <h2>Notícias</h2>
          <span>Hacker News</span>
        </div>

        <div class="news-container" id="newsList" aria-live="polite"></div>

        <nav class="pagination" aria-label="Paginação de notícias">
          <button id="prevBtn" type="button" aria-label="Página anterior">
            ◀
          </button>
          <span id="pageLabel">1 / 3</span>
          <button id="nextBtn" type="button" aria-label="Próxima página">
            ▶
          </button>
        </nav>
      </aside>

      <!-- ÍCONES DA ÁREA DE TRABALHO -->
      <div class="desktop-icons">
        <button class="desktop-icon" type="button" data-open="about">
          <span class="ico" aria-hidden="true">📄</span><span>Currículo</span>
        </button>
        <button class="desktop-icon" type="button" data-open="portfolio">
          <span class="ico" aria-hidden="true">🗂️</span><span>Projetos</span>
        </button>
      </div>

      <!-- JANELAS -->
      <div id="windows"></div>

      <!-- DOCK -->
      <div class="dock-wrap">
        <div class="dock" id="dock" role="toolbar" aria-label="Dock">
          <button class="dock-item" type="button" data-open="about">
            <span aria-hidden="true">👤</span>
            <span class="dock-tooltip">Sobre mim</span>
          </button>
          <button class="dock-item" type="button" data-open="portfolio">
            <span aria-hidden="true">💼</span>
            <span class="dock-tooltip">Portfólio</span>
          </button>
          <button class="dock-item" type="button" data-open="contact">
            <span aria-hidden="true">✉️</span>
            <span class="dock-tooltip">Contato</span>
          </button>
          <button class="dock-item" type="button" data-open="music">
            <span aria-hidden="true">🎵</span>
            <span class="dock-tooltip">Música</span>
          </button>

          <div class="dock-separator" aria-hidden="true"></div>

          <button
            class="dock-item"
            type="button"
            data-external="https://www.linkedin.com/in/allyson-de-oliveira-6b3596164/"
          >
            <span aria-hidden="true">🔗</span>
            <span class="dock-tooltip">LinkedIn</span>
          </button>
          <button
            class="dock-item"
            type="button"
            data-external="https://github.com/Allysonubius"
          >
            <span aria-hidden="true">🐙</span>
            <span class="dock-tooltip">GitHub</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
